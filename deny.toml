[graph]
targets = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    { name = "v8" },
    { name = "deno_core" },
    { name = "pyo3" },
    { name = "rhai" },
    { name = "wry" },
]

# Eccezioni motivate (REQ-LIC-02). Elenco font e licenze: docs/third-party-assets.md.
# epaint_default_fonts: font predefiniti di egui incorporati nel binario
# (Ubuntu-Light: Ubuntu Font Licence 1.0; NotoEmoji-Regular: OFL-1.1). Sono asset
# font, non codice; entrambe le licenze consentono redistribuzione incorporata.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

# Avvisi "unmaintained" (non vulnerabilita') su crate del solo backend Linux di
# accesskit (accesskit_unix -> zbus/zvariant, AT-SPI). Non compilati per il
# target distribuito x86_64-pc-windows-msvc. Da rivalutare con il supporto Linux.
[advisories]
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant: solo accesskit_unix (Linux), non nel target Windows" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: solo accesskit_unix (Linux), non nel target Windows" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: solo accesskit_unix (Linux), non nel target Windows" },
]
