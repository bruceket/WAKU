[workspace]
resolver = "3"
members = ["crates/commands", "crates/domain", "crates/geometry", "crates/ifc", "crates/persistence", "xtask"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.100"

[workspace.dependencies]
cargo_metadata = "=0.23.1"
anyhow = "=1.0.104"
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.21"
uuid = { version = "=1.29.3", features = ["v4"] }
proptest = "=1.12.0"
nalgebra = { version = "=0.35.0", features = ["serde-serialize"] }
petgraph = { version = "=0.8.3", default-features = false, features = ["std"] }
zip = { version = "=9.6.1", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
humantime = "=2.4.0"
