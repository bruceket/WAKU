[workspace]
resolver = "3"
members = ["apps/cli", "crates/commands", "crates/domain", "crates/geometry", "crates/mcp", "crates/ifc", "crates/persistence", "crates/render", "xtask"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.100"

[workspace.dependencies]
cargo_metadata = "=0.23.1"
anyhow = "=1.0.104"
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.21"
uuid = { version = "=1.29.3", features = ["v4"] }
proptest = "=1.12.0"
nalgebra = { version = "=0.35.0", features = ["serde-serialize"] }
petgraph = { version = "=0.8.3", default-features = false, features = ["std"] }
zip = { version = "=9.6.1", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
humantime = "=2.4.0"
clap = { version = "=4.6.8", features = ["derive"] }
assert_cmd = "=2.2.2"
predicates = "=3.1.4"
egui = { version = "=0.37.0", default-features = false }
egui-wgpu = { version = "=0.37.0" }
bytemuck = { version = "=1.25.0", features = ["derive"] }
pollster = "=0.4.0"
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }
sha2 = "=0.10.9"
getrandom = "=0.4.3"
