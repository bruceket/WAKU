[workspace]
resolver = "3"
members = ["crates/domain", "xtask"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.100"

[workspace.dependencies]
cargo_metadata = "=0.23.1"
anyhow = "=1.0.104"
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.21"
uuid = { version = "=1.29.3", features = ["v4"] }
proptest = "=1.12.0"
